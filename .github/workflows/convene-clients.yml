name: Convene client candidates

on:
  push:
    branches: [codex/convene-client-builds]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: convene-clients-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 0.1.3-1

jobs:
  quality:
    name: Candidate quality
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml

  bundle:
    needs: quality
    name: Build shared bundle and Windows WSL runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.candidate.outputs.version }}
      desktop_matrix: ${{ steps.platforms.outputs.desktop_matrix }}
    steps:
      - name: Checkout
        id: source
        shell: bash
        env:
          QUALITY_SHA: ${{ needs.quality.outputs.source_sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
          actual=$(git rev-parse HEAD)
          test "$actual" = "$GITHUB_SHA"
          test "$actual" = "$QUALITY_SHA"
          echo "source_sha=$actual" >> "$GITHUB_OUTPUT"
      - name: Select all publication platforms
        id: platforms
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          targets = [
            {"label":"Linux x64","runner":"ubuntu-24.04","platform":"linux","target":"AppImage","arch":"x64","rust_target":"x86_64-unknown-linux-gnu","resource_key":"linux-x64"},
            {"label":"Windows x64","runner":"ubuntu-24.04","verify_runner":"windows-2025","platform":"win","target":"nsis","arch":"x64","rust_target":"x86_64-pc-windows-msvc","resource_key":"win32-x64"},
            {"label":"macOS arm64","runner":"macos-15","platform":"mac","target":"dmg","arch":"arm64","rust_target":"aarch64-apple-darwin","resource_key":"darwin-arm64"},
          ]
          print("desktop_matrix=" + json.dumps(targets))
          PY
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts... --frozen-lockfile
      - name: Install Linux build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Align candidate version
        id: candidate
        run: |
          node scripts/update-release-package-versions.ts "$APP_VERSION"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build shared desktop bundle
        # Private presets are added only during packaging, never to the shared Web bundle.
        run: vp run build:desktop
      - name: Apply the same release branding as desktop packaging
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client
      - name: Export matching Web resources
        run: node scripts/convene-web-build.mjs export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: convene-web
          path: release-web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Upload shared bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          include-hidden-files: true
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - name: Build Linux CLI for the Windows WSL backend
        env:
          VP_NODE_VERSION: "26.12.1"
        run: |
          set -euo pipefail
          cargo build --manifest-path native/resource-monitor/Cargo.toml --locked --release --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"
          node apps/server/scripts/cli.ts build-exe --verbose
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$APP_VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$APP_VERSION"
      - name: Upload Windows WSL runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-linux-x64
          path: release-cli/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  desktop:
    needs: bundle
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.bundle.outputs.desktop_matrix) }}
    uses: ./.github/workflows/release-desktop.yml
    secrets:
      CONVENE_PLATFORM_URLS: ${{ secrets.CONVENE_PLATFORM_URLS }}
      CONVENE_PACKAGE_TRANSPORT_KEY: ${{ secrets.CONVENE_PACKAGE_TRANSPORT_KEY }}
    with:
      convene_private_distribution: true
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      verify_runner: ${{ matrix.verify_runner || '' }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: ${{ matrix.resource_key }}
      version: ${{ needs.bundle.outputs.version }}
      ref: ${{ needs.bundle.outputs.source_sha }}
      release_channel: preview
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""

  publication-input:
    name: Prepare the selected client packages
    needs: [quality, bundle, desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout publication adapter
        shell: bash
        env:
          QUALITY_SHA: ${{ needs.quality.outputs.source_sha }}
          BUNDLE_SHA: ${{ needs.bundle.outputs.source_sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
          actual=$(git rev-parse HEAD)
          test "$actual" = "$GITHUB_SHA"
          test "$actual" = "$QUALITY_SHA"
          test "$actual" = "$BUNDLE_SHA"
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          run-install: false
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: accepted-desktop
      - uses: actions/download-artifact@v8
        with:
          name: convene-web
          path: accepted-desktop/convene-web
      - name: Decrypt accepted packages
        env:
          CONVENE_PACKAGE_TRANSPORT_KEY: ${{ secrets.CONVENE_PACKAGE_TRANSPORT_KEY }}
        run: |
          for directory in accepted-desktop/desktop-*; do
            node scripts/convene-private-package.mjs decrypt "$directory/package.enc" "$directory"
            rm "$directory/package.enc"
          done
      - name: Write publication metadata from this run
        env:
          ACCEPTED_VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          node scripts/prepare-convene-release.mjs \
            --artifacts accepted-desktop --output convene-clients \
            --version "$ACCEPTED_VERSION" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Encrypt publication input
        env:
          CONVENE_PACKAGE_TRANSPORT_KEY: ${{ secrets.CONVENE_PACKAGE_TRANSPORT_KEY }}
        run: node scripts/convene-private-package.mjs encrypt convene-clients convene-client-publication.enc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: convene-client-publication
          include-hidden-files: true
          path: convene-client-publication.enc
          if-no-files-found: error
          retention-days: 3
