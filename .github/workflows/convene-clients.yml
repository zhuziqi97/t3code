name: Convene client candidates

on:
  push:
    branches: [codex/convene-client-builds]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: convene-clients-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 0.0.45-convene.23

jobs:
  bundle:
    name: Build shared bundle and Windows WSL runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts... --frozen-lockfile
      - name: Install Linux build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Align candidate version
        id: candidate
        run: |
          node scripts/update-release-package-versions.ts "$APP_VERSION"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
      - name: Prepare shared build identity
        run: node scripts/convene-web-build.mjs prepare
      - name: Build shared desktop bundle
        # Addresses are runtime-only private configuration. No deployment secrets
        # or local configuration files are passed to any build or artifact.
        run: vp run build:desktop
      - name: Export matching Web resources
        run: node scripts/convene-web-build.mjs export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: convene-web
          path: release-web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Upload shared bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - name: Build Linux CLI for the Windows WSL backend
        env:
          VP_NODE_VERSION: "26.8.2"
        run: |
          set -euo pipefail
          cargo build --manifest-path native/resource-monitor/Cargo.toml --locked --release --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"
          node apps/server/scripts/cli.ts build-exe --verbose
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$APP_VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$APP_VERSION"
      - name: Upload Windows WSL runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-linux-x64
          path: release-cli/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  desktop:
    needs: bundle
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: ${{ matrix.resource_key }}
      version: ${{ needs.bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: preview
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""

  publication-input:
    name: Prepare the four accepted client packages
    needs: [bundle, desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout publication adapter
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          run-install: false
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: accepted-desktop
      - uses: actions/download-artifact@v8
        with:
          name: convene-web
          path: accepted-desktop/convene-web
      - name: Write publication metadata from this run
        env:
          ACCEPTED_VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          node scripts/prepare-convene-release.mjs \
            --artifacts accepted-desktop --output convene-clients \
            --version "$ACCEPTED_VERSION" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: convene-client-publication
          include-hidden-files: true
          path: convene-clients/
          if-no-files-found: error
          retention-days: 3
